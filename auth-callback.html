<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you in | AuraStore</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<!-- brand-meta:start -->
<link rel="icon" type="image/svg+xml" href="images/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/brand/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/brand/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0f172a">
<!-- brand-meta:end -->
</head>
<body>
<main><div class="wrap auth-wrap"><div class="auth-card" id="card" aria-live="polite">
  <div class="spinner" role="status"></div><h1>Signing you in</h1><p>One moment, we are finishing up and saving your cart.</p>
</div></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script>
(function () {
  const safe = u => (u && /^[a-z0-9-]+\.html(\?[^\s]*)?$/i.test(u)) ? u : 'index.html';
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const err = Aura.qs('error') || hash.get('error');
  const toLogin = code => location.replace('login.html?error=' + encodeURIComponent(code));
  if (err) return toLogin(err === 'access_denied' ? 'access_denied' : 'failed');      // P6-03

  const timeout = new Promise(r => setTimeout(() => r(null), 10000));
  const session = (async () => {                                                      // P6-01: wait for the session
    let s = await Aura.auth.getSession(); if (s) return s;
    return new Promise(res => Aura.auth.onChange((ev, sess) => { if (sess) res(sess); }));
  })();
  Promise.race([session, timeout]).then(async s => {
    if (!s) return toLogin('timeout');
    try { await Promise.race([Aura.cart.ready, new Promise(r => setTimeout(r, 5000))]); } catch (e) {}   // P6-02: cart merge
    const r = safe(sessionStorage.getItem('aura_return'));
    sessionStorage.removeItem('aura_return'); sessionStorage.removeItem('aura_login_reason');
    location.replace(r);
  });
})();
</script>
</body>
</html>
